name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Security: only trusted actors (OWNER/MEMBER/COLLABORATOR) mentioning
    # @claude may invoke the bot via comment. Drop `issues: opened` and
    # `pull_request: opened` triggers because those fire from untrusted actors
    # without a body to verify a mention.
    if: |
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      # Pin endpoint in workflow (visible in code review); only API key in secret.
      ANTHROPIC_BASE_URL: https://api.minimaxi.com
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.2.2
        with:
          fetch-depth: 1
      - name: Run Claude Code (routed via MiniMax)
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}