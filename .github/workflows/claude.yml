name: claude

# Note on inference routing: this workflow intentionally sends Claude Code
# requests through https://api.minimax.io/anthropic (a third-party MiniMax proxy)
# instead of api.anthropic.com. The MiniMax proxy sees:
#   - the full prompt + tool output of every invocation
#   - the auth token value (which must therefore be a MiniMax-issued key,
#     NOT an upstream Anthropic key)
# This was an explicit user decision (see session 2026-08-29).
# To revert, replace the ANTHROPIC_BASE_URL value with https://api.anthropic.com
# and rotate the key.
#
# Auth header note: MiniMax expects Authorization: Bearer <token> (OpenAI-style),
# not Anthropic-native x-api-key. The Anthropic SDK honors ANTHROPIC_AUTH_TOKEN
# (Bearer) over ANTHROPIC_API_KEY (x-api-key); we use ANTHROPIC_AUTH_TOKEN here.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Security gate (in priority order):
    #   1. trigger is a comment event (issue_comment OR pull_request_review_comment)
    #   2. author is a repo OWNER, MEMBER, or COLLABORATOR (drops random forks)
    #   3. body contains the literal "@claude" token on a word boundary
    #      (regex avoids "@claudette", "@claude-bot-rating", etc.)
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      matches(github.event.comment.body, '(^|\s)@claude(\s|$|[,.])')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      ANTHROPIC_BASE_URL: https://api.minimax.io/anthropic
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.2.2
        with:
          fetch-depth: 1
      - name: Run Claude Code (routed via MiniMax)
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}